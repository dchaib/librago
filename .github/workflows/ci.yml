name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify Playwright versions
        shell: pwsh
        run: ./scripts/verify-playwright-versions.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.4xx
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore dependencies
        run: dotnet restore Librago.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format Librago.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Librago.slnx --configuration Release --no-restore

      - name: Install Playwright Chromium
        run: pwsh src/Librago/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test Librago.slnx --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage"

      - name: Verify artifact secret exclusion
        shell: pwsh
        run: ./scripts/verify-artifact-secrets.ps1 -Image librago:ci

      - name: Verify hardened container runtime
        shell: pwsh
        run: ./scripts/verify-container.ps1 -Image librago:ci
